<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mermaid Fence Renderer - Sites</title>
    <link rel="stylesheet" href="../shared/ui.css" />
  </head>
  <body>
    <main>
      <h1>Mermaid Fence Renderer</h1>
      <p class="muted">
        Fenced <code>```mermaid</code> blocks are rendered only on sites you allow. Diagrams are drawn locally and no
        network requests are made.
      </p>

      <section class="card">
        <h2>Allow a site</h2>
        <label for="origin">Site URL</label>
        <input id="origin" type="url" placeholder="https://tfs.contoso.local" />
        <button id="grant" type="button">Grant access and enable</button>
        <p id="grant-msg" class="msg" role="status"></p>
      </section>

      <section class="card">
        <h2>Enabled sites</h2>
        <ul id="sites"></ul>
        <p id="empty" class="muted" hidden>No sites enabled yet.</p>
      </section>
    </main>
    <script src="../shared/sites.js"></script>
    <script src="options.js"></script>
  </body>
</html>
